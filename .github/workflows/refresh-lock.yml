name: Refresh dependency lockfile

on:
  push:
    branches:
      - final/pilot-readiness
    paths:
      - apps/web/package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/pilot-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh dependency lockfile"
          git push origin HEAD:final/pilot-readiness
