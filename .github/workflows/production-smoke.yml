name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify production API
        id: api
        continue-on-error: true
        shell: bash
        run: |
          set +e
          body_file=/tmp/simforge-api-body.txt
          diag_file=/tmp/simforge-api-diagnostic.txt
          passed=false
          curl_exit=1
          http_code=000

          for attempt in {1..12}; do
            : > "$body_file"
            http_code=$(curl -sS --max-time 20 -o "$body_file" -w "%{http_code}" https://simforge-updz.onrender.com/health)
            curl_exit=$?

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ]; then
              node -e 'const fs=require("fs");try{const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(body.status!=="ok"||body.service!=="simforge-api")process.exit(1)}catch{process.exit(1)}' "$body_file"
              if [ "$?" -eq 0 ]; then
                passed=true
                break
              fi
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done

          {
            echo "endpoint=https://simforge-updz.onrender.com/health"
            echo "curl_exit=$curl_exit"
            echo "http_code=$http_code"
            echo "response_body_begin"
            head -c 1000 "$body_file" 2>/dev/null || true
            echo
            echo "response_body_end"
          } > "$diag_file"

          if [ "$passed" = true ]; then
            echo "Production API health check passed."
            exit 0
          fi

          echo "::error title=Production API smoke failed::curl exit $curl_exit; HTTP $http_code"
          cat "$diag_file"
          exit 1

      - name: Verify production web login
        id: web
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          body_file=/tmp/simforge-web-body.txt
          diag_file=/tmp/simforge-web-diagnostic.txt
          http_code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 -o "$body_file" -w "%{http_code}" https://simforge-web-pi.vercel.app/login)
          curl_exit=$?

          {
            echo "endpoint=https://simforge-web-pi.vercel.app/login"
            echo "curl_exit=$curl_exit"
            echo "http_code=$http_code"
            bytes=$(wc -c < "$body_file" 2>/dev/null || echo 0)
            echo "response_bytes=$bytes"
          } > "$diag_file"

          if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ] && [ -s "$body_file" ]; then
            echo "Production web login route passed."
            exit 0
          fi

          echo "::error title=Production web smoke failed::curl exit $curl_exit; HTTP $http_code"
          cat "$diag_file"
          exit 1

      - name: Update production incident
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_OUTCOME: ${{ steps.api.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          title="[Production Smoke] SimForge availability failure"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)

          if [ "$API_OUTCOME" = "success" ] && [ "$WEB_OUTCOME" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Production smoke recovered successfully on commit $HEAD_SHA."
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
            exit 0
          fi

          {
            echo "Automated production smoke failed."
            echo
            echo "Commit: $HEAD_SHA"
            echo "API outcome: $API_OUTCOME"
            echo "Web outcome: $WEB_OUTCOME"
            echo "Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "### API diagnostic"
            echo '~~~text'
            cat /tmp/simforge-api-diagnostic.txt 2>/dev/null || echo "API diagnostic unavailable."
            echo '~~~'
            echo
            echo "### Web diagnostic"
            echo '~~~text'
            cat /tmp/simforge-web-diagnostic.txt 2>/dev/null || echo "Web diagnostic unavailable."
            echo '~~~'
          } > /tmp/smoke-issue.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/smoke-issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/smoke-issue.md
          fi

      - name: Enforce smoke result
        if: always()
        shell: bash
        env:
          API_OUTCOME: ${{ steps.api.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
        run: |
          if [ "$API_OUTCOME" != "success" ] || [ "$WEB_OUTCOME" != "success" ]; then
            exit 1
          fi

      - name: Record smoke result
        if: always()
        shell: bash
        run: |
          {
            echo "## SimForge production smoke"
            echo
            echo "- API: https://simforge-updz.onrender.com/health"
            echo "- Web: https://simforge-web-pi.vercel.app/login"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "- API outcome: ${{ steps.api.outcome }}"
            echo "- Web outcome: ${{ steps.web.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
