name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS --max-time 45 https://simforge-updz.onrender.com/health -o /tmp/health.json; then
              if node -e '
                const fs = require("fs");
                const body = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
                if (body.status !== "ok" || body.service !== "simforge-api") process.exit(1);
              '; then
                echo "Production API health check passed."
                cat /tmp/health.json
                exit 0
              fi
            fi
            echo "API not ready yet (attempt ${attempt}/12)."
            sleep 15
          done
          echo "Production API health check failed after retries."
          exit 1

      - name: Verify production web login
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             --retry 5             --retry-all-errors             --retry-delay 10             --max-time 60             https://simforge-web-pi.vercel.app/login             -o /tmp/login.html
          test -s /tmp/login.html
          echo "Production web login route returned a non-empty successful response."

      - name: Record smoke result
        if: always()
        shell: bash
        run: |
          {
            echo "## SimForge production smoke"
            echo ""
            echo "- API: https://simforge-updz.onrender.com/health"
            echo "- Web: https://simforge-web-pi.vercel.app/login"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
