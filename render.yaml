services:
  - type: web
    name: simforge-api
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run render-build
    startCommand: npm run start --workspace @simforge/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_URL
        sync: false
      # Without this the API silently falls back to non-AI placeholder scoring.
      - key: OPENAI_API_KEY
        sync: false
      # Secret for GET /health/details (x-health-token header). Leave unset to disable.
      - key: HEALTH_DETAILS_TOKEN
        generateValue: true
      - key: FRONTEND_URL
        value: https://simforge-web-pi.vercel.app
